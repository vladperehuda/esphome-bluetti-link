# Bluetti AC180P -> Home Assistant over the ESPHome native API.
# The Modbus protocol lives in bluetti_ac180p.h and the NimBLE transport in bluetti_ble.h; the
# entities below just read from them.

substitutions:
  name: bluetti
  friendly_name: Bluetti AC180P
  bluetti_mac: !secret bluetti__bluetti_mac

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  includes:
    - bluetti_ac180p.h
    - bluetti_ble.h
  on_boot:
    then:
      # The BLE task waits for WiFi before it connects.
      - lambda: bluetti::ble.begin("${bluetti_mac}");

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true
      flash_chip: generic
    components:
      - name: h2zero/esp-nimble-cpp
        ref: 2.3.4
    sdkconfig_options:
      # Reboot on a stalled loop: the WiFi/API reboot_timeouts only help when the loop still runs.
      CONFIG_ESP_TASK_WDT_PANIC: "y"
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "30"
      CONFIG_ESP_TASK_WDT_CHECK_IDLE_TASK_CPU0: "y"
      CONFIG_ESP_TASK_WDT_CHECK_IDLE_TASK_CPU1: "y"
      # NimBLE host + controller, BLE only, central role, one connection.
      CONFIG_BT_ENABLED: "y"
      CONFIG_BT_BLE_42_FEATURES_SUPPORTED: "y"
      CONFIG_BT_BLE_50_FEATURES_SUPPORTED: "n"
      CONFIG_BT_BLUEDROID_ENABLED: "n"
      CONFIG_BT_NIMBLE_ENABLED: "y"
      CONFIG_BTDM_CTRL_MODE_BLE_ONLY: "y"
      CONFIG_BT_NIMBLE_MAX_CONNECTIONS: "1"
      CONFIG_BTDM_CTRL_BLE_MAX_CONN: "1"
      # TEST: the stall happens with the controller merely initialised, so take its sleep/wake cycle
      # out of the picture (mains powered, no need for BT modem sleep).
      CONFIG_BTDM_CTRL_MODEM_SLEEP: "n"
      CONFIG_BT_NIMBLE_ROLE_PERIPHERAL: "n"
      CONFIG_BT_NIMBLE_ROLE_BROADCASTER: "n"
      # NimBLE host on core 1. The controller stays on core 0 with WiFi.
      CONFIG_BT_NIMBLE_PINNED_TO_CORE_1: "y"
      # WiFi/BLE coexistence is normally requested by esp32_ble, which is not used any more.
      CONFIG_ESP_COEX_SW_COEXIST_ENABLE: "y"

logger:
  level: DEBUG

api:
  encryption:
    key: !secret bluetti__api_key
  reboot_timeout: 90s

ota:
  - platform: esphome
    encryption:

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      bssid: !secret wifi_primary_bssid
  reboot_timeout: 5min
  post_connect_roaming: false

debug:
  update_interval: 60s

switch:
  # Off releases the station (e.g. for the phone app); on reconnects.
  - platform: template
    name: BLE connection
    entity_category: config
    restore_mode: DISABLED
    lambda: return bluetti::ble.enabled();
    turn_on_action:
      - lambda: bluetti::ble.set_enabled(true);
    turn_off_action:
      - lambda: bluetti::ble.set_enabled(false);

  # restore_mode DISABLED: never replay a stored state as a command to the station on boot.
  - platform: template
    name: AC output
    restore_mode: DISABLED
    lambda: |-
      if (!bluetti::client.live()) return {};
      return bluetti::client.ac_on();
    turn_on_action:
      - lambda: bluetti::client.set_ac(true);
    turn_off_action:
      - lambda: bluetti::client.set_ac(false);
  - platform: template
    name: DC output
    restore_mode: DISABLED
    lambda: |-
      if (!bluetti::client.live()) return {};
      return bluetti::client.dc_on();
    turn_on_action:
      - lambda: bluetti::client.set_dc(true);
    turn_off_action:
      - lambda: bluetti::client.set_dc(false);
  - platform: template
    name: Power lifting
    restore_mode: DISABLED
    lambda: |-
      if (!bluetti::client.live()) return {};
      return bluetti::client.lift_on();
    turn_on_action:
      - lambda: bluetti::client.set_lift(true);
    turn_off_action:
      - lambda: bluetti::client.set_lift(false);

select:
  - platform: template
    name: Charge mode
    options:
      - Silent
      - Standard
      - Turbo
    # Cheap local read, no BLE traffic. Unlike the template switches (re-evaluated every loop), the select
    # only runs its lambda on this interval, so it sets how soon a write read-back shows up in HA.
    update_interval: 1s
    lambda: |-
      if (!bluetti::client.live()) return {};
      std::string m = bluetti::client.mode_label();
      if (m.empty()) return {};
      return m;
    set_action:
      - lambda: bluetti::client.set_mode(x);

binary_sensor:
  - platform: template
    name: Bluetti link
    device_class: connectivity
    entity_category: diagnostic
    lambda: return bluetti::client.live();

sensor:
  - platform: template
    name: Battery
    device_class: battery
    state_class: measurement
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 15s
    lambda: return bluetti::client.soc();
  - platform: template
    name: Input power
    device_class: power
    state_class: measurement
    unit_of_measurement: W
    accuracy_decimals: 0
    update_interval: 15s
    lambda: return bluetti::client.in_w();
  - platform: template
    name: Output power
    device_class: power
    state_class: measurement
    unit_of_measurement: W
    accuracy_decimals: 0
    update_interval: 15s
    lambda: return bluetti::client.out_w();
  - platform: template
    name: Net power
    device_class: power
    state_class: measurement
    unit_of_measurement: W
    accuracy_decimals: 0
    update_interval: 15s
    lambda: return bluetti::client.net_w();
  - platform: template
    name: AC input power
    device_class: power
    state_class: measurement
    unit_of_measurement: W
    accuracy_decimals: 0
    update_interval: 15s
    lambda: return bluetti::client.ac_in();
  - platform: template
    name: DC input power
    device_class: power
    state_class: measurement
    unit_of_measurement: W
    accuracy_decimals: 0
    update_interval: 15s
    lambda: return bluetti::client.dc_in();
  - platform: template
    name: AC output power
    device_class: power
    state_class: measurement
    unit_of_measurement: W
    accuracy_decimals: 0
    update_interval: 15s
    lambda: return bluetti::client.ac_out();
  - platform: template
    name: DC output power
    device_class: power
    state_class: measurement
    unit_of_measurement: W
    accuracy_decimals: 0
    update_interval: 15s
    lambda: return bluetti::client.dc_out();
  - platform: template
    name: AC input voltage
    device_class: voltage
    state_class: measurement
    unit_of_measurement: V
    accuracy_decimals: 1
    update_interval: 15s
    lambda: return bluetti::client.ac_in_v();
  - platform: template
    name: Time remaining
    device_class: duration
    state_class: measurement
    unit_of_measurement: h
    accuracy_decimals: 1
    update_interval: 15s
    lambda: return bluetti::client.time_h();

  # Diagnostics
  - platform: wifi_signal
    name: WiFi signal
    update_interval: 60s
  - platform: debug
    free:
      name: Free heap
  - platform: uptime
    name: Uptime
    entity_category: diagnostic

text_sensor:
  - platform: debug
    reset_reason:
      name: Reset reason
      entity_category: diagnostic

interval:
  - interval: 60s
    then:
      - lambda: |-
          ESP_LOGD("hb", "wifi=%d rssi=%d heap=%u", (int) wifi::global_wifi_component->is_connected(),
                   (int) wifi::global_wifi_component->wifi_rssi(), (unsigned) esp_get_free_heap_size());
